# ---- 빌드 대상 IDE (IntelliJ Platform) ----
# 비워 두면 OS 별 Android Studio 기본 설치 경로를 자동 탐색하고,
# 없으면 platformFallbackVersion 의 Android Studio 를 내려받아 사용한다.
# 다른 IDE(예: IntelliJ IDEA)로 빌드하려면 설치 루트를 지정 (Windows/Linux: 설치 폴더, macOS: *.app/Contents)
#   ideLocalPath=C:/Program Files/Android/Android Studio
#   ideLocalPath=/Applications/Android Studio.app/Contents
# 환경변수 TERMINAL_ALERT_IDE_HOME 으로도 지정 가능.
#ideLocalPath=

# 로컬 IDE 가 없을 때 내려받을 Android Studio 버전
platformFallbackVersion=2026.1.3.7
